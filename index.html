<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verificación de Certificados — Money First</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{{box-sizing:border-box;margin:0;padding:0}}
body{{font-family:'Outfit',sans-serif;background:#0B1F3A;color:#F5F2EB;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;text-align:center}}
.logo{{font-weight:800;font-size:22px;margin-bottom:32px}}.logo span{{color:#C9A84C}}
h1{{font-size:22px;font-weight:600;margin-bottom:12px}}
p{{font-size:14px;color:#8A9BB5;max-width:400px;line-height:1.6;margin-bottom:32px}}
.hint{{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:20px 28px;font-family:'Courier New',monospace;font-size:13px;color:#C9A84C;max-width:420px}}
.hint span{{color:#8A9BB5}}
</style>
</head>
<body>
  <div class="logo">MONEY<span> FIRST</span></div>
  <h1>Portal de verificación</h1>
  <p>Para verificar un certificado, accede a la URL con el ID de credencial correspondiente.</p>
  <div class="hint"><span>tu-dominio/</span>MF-ED1-001</div>
</body>
</html>
